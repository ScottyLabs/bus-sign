[project]
name = "bus-sign"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
AWS_ACCESS_KEY_ID = { description = "sccache S3 access key ID", ref = { item = "shared/sccache", field = "AWS_ACCESS_KEY_ID" } }
AWS_SECRET_ACCESS_KEY = { description = "sccache S3 secret access key", ref = { item = "shared/sccache", field = "AWS_SECRET_ACCESS_KEY" } }
PRT_API_KEY = { description = "Pittsburgh Regional Transit API key" }
OPENWEATHER_API_KEY = { description = "OpenWeatherMap API key" }

[profiles.prod]

[profiles.preview]

[profiles.staging]

[profiles.dev]
